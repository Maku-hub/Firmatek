name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to stamp on the installers (e.g. 1.2.3). Leave empty to use the default."
        required: false
        default: ""

# Pin the Rust toolchain so installer builds are reproducible. Keep it in sync
# with `rust-version` in client/src-tauri/Cargo.toml; the rust-check job
# fails if Cargo.lock starts needing a newer compiler.
env:
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  # Fast quality gate — runs on every push and PR.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25', cache-dependency-path: server/go.sum }
      - name: Go tests (race) + vet
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test -race ./...
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Client typecheck + build
        working-directory: client
        run: |
          npm ci
          npm run build

  # Compiles the desktop app with the pinned toolchain on every push, so a
  # dependency update that raises the minimum Rust version is caught here and
  # not when someone tries to build installers.
  rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: cargo check
        working-directory: client/src-tauri
        run: |
          # tauri::generate_context! needs the built frontend directory to exist
          mkdir -p ../dist
          cargo check --locked

  # Installers are built on demand only (tags/releases are created manually).
  # Trigger from the Actions tab → "Run workflow", then download the artifacts
  # and attach them to a GitHub Release by hand.
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, rust-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - name: Build .msi
        working-directory: client
        env:
          APP_VERSION: ${{ github.event.inputs.version }}
        run: |
          npm ci
          npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: client/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, rust-check]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        bundle: [appimage, deb, rpm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2 rpm
      - name: Build ${{ matrix.bundle }}
        working-directory: client
        env:
          APP_VERSION: ${{ github.event.inputs.version }}
        run: |
          npm ci
          npm run tauri:build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.bundle }}
          path: |
            client/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.AppImage
            client/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.deb
            client/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.rpm
          if-no-files-found: ignore
