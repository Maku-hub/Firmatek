# Firmatek TURN Server Configuration
listening-port=3478
tls-listening-port=5349

# Zmień na zewnętrzny IP serwera (lub zostaw puste dla autodetekcji w LAN)
# external-ip=1.2.3.4

# Dane uwierzytelniające (muszą zgadzać się z konfiguracją klienta)
realm=firmatek.local
server-name=firmatek

# Statyczny użytkownik TURN (możesz dodać więcej)
user=firmatek:turn_secret_change_me

# Zakres portów dla relay
min-port=49152
max-port=65535

# Logi
log-file=/var/log/coturn/turnserver.log
simple-log

# Bezpieczeństwo
no-multicast-peers
no-cli
fingerprint
lt-cred-mech

# Ograniczenia przepustowości (opcjonalne, w KB/s)
# max-bps=1000000
