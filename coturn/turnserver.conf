# Firmatek TURN Server Configuration
listening-port=3478

# TLS relay (TURNS): enable only after providing a certificate/key.
# tls-listening-port=5349
# cert=/etc/coturn/turn.crt
# pkey=/etc/coturn/turn.key

# Set to the server's external IP (or leave empty for LAN auto-detection)
# external-ip=1.2.3.4

realm=firmatek.local
server-name=firmatek

# Authentication: time-limited credentials via a shared secret (coturn REST API
# scheme). The secret is supplied at runtime by docker-compose
# (--static-auth-secret from $TURN_SECRET) and must match the app server's
# TURN_SECRET. No static long-term credentials are stored here.
use-auth-secret
lt-cred-mech

# Relay port range
min-port=49152
max-port=65535

# Logs to stdout so `docker compose logs` works
log-file=stdout
simple-log

# ─── Security ───────────────────────────────────────────────────────────────
fingerprint
no-cli
no-multicast-peers

# Block relaying to loopback, link-local and cloud-metadata addresses (SSRF).
# NOTE: RFC1918 ranges are intentionally left allowed so peers on the same
# corporate LAN can relay to each other. On cloud/DMZ deployments where clients
# are not on the internal network, ALSO deny:
#   denied-peer-ip=10.0.0.0-10.255.255.255
#   denied-peer-ip=172.16.0.0-172.31.255.255
#   denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Anti-abuse quotas
total-quota=100
user-quota=6
# Optional bandwidth cap per allocation (bytes/s):
# max-bps=1000000
